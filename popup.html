<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 16px; font: 14px/1.5 -apple-system, "Malgun Gothic", sans-serif; color: #1a1a1a; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: #555; margin-top: 8px; }
  input[type=date] { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  .presets { display: flex; gap: 6px; margin-top: 8px; }
  .presets button { flex: 1; padding: 4px 0; font-size: 12px; cursor: pointer; }
  #go { width: 100%; margin-top: 14px; padding: 10px; font: inherit; font-weight: 600; background: #03c75a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #go:disabled { background: #9bd9b4; cursor: default; }
  #msg { margin-top: 10px; font-size: 12px; color: #444; white-space: pre-wrap; min-height: 18px; }
  #dump { margin-top: 6px; background: none; border: 0; color: #888; font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; }
</style>
</head>
<body>
  <h1>네이버페이 구매내역 → 엑셀</h1>
  <label>시작일 <input type="date" id="start"></label>
  <label>종료일 <input type="date" id="end"></label>
  <div class="presets">
    <button data-p="thisMonth">이번 달</button>
    <button data-p="lastMonth">지난 달</button>
    <button data-p="30">최근 30일</button>
  </div>
  <button id="go">조회 후 엑셀 저장</button>
  <div id="msg"></div>
  <button id="dump">진단: 화면 텍스트 복사</button>
  <script src="xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
